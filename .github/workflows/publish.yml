name: Sync Backend to Hugging Face Hub
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push backend subdirectory to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub Actions"
          git clone https://user:${HF_TOKEN}@huggingface.co/spaces/mallik-amaan/edubot-backend hf_repo
          rsync -av --delete --exclude='.git' backend/ hf_repo/
          cd hf_repo
          git add -A
          git diff --cached --quiet || git commit -m "Sync backend from GitHub @ ${{ github.sha }}"
          git push
